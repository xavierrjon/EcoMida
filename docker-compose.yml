services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ecomida-backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-ecomida-dev-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ecomida-dev-jwt-secret}
      APP_ENV: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      DATABASE_URL: sqlite:////data/ecomida.db
    volumes:
      - ecomida_data:/data
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ecomida-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ecomida_data: